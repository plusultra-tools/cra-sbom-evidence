name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: "Python ${{ matrix.python-version }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff lint
        run: python -m ruff check src tests

      - name: Mypy type check
        run: python -m mypy --strict src

      - name: Run tests
        run: python -m pytest -q

      - name: Smoke test CLI
        run: |
          cra-sbom --version
          cra-sbom evidence \
            --sbom tests/fixtures/cyclonedx-sample.json \
            --vex tests/fixtures/openvex-sample.json \
            --product tests/fixtures/product.yaml \
            --out /tmp/evidence-pack-smoke
          cra-sbom verify --evidence-pack /tmp/evidence-pack-smoke
          cra-sbom verify-citations
